# CAEN N1408 (Si bias): monitor + per-channel ON/OFF web page -- see TODO/82_n1408_si_hv_control.md

# The N1408's USB chip has no serial number, so this path is generic: the program checks
# BDNAME and BDSNUM below after opening it and refuses any other unit.
serial_port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial-if00-port0"
expected_serial: 1592
board: 0

# InfluxDB tag `device` on the n1408 / n1408_event tables.
device_name: "si_bias"
influx_url: "http://localhost:8086/api/v3/write_lp?db=delila"
poll_interval_sec: 2.0

http_host: "0.0.0.0"
http_port: 8095

# One line of plain text on the host, NOT in this repo (the repo is public). It prevents accidents,
# it is not security. No file = read-only. Read at every login, so no restart is needed.
passphrase_file: "/home/daq/.config/delila/n1408_passphrase"
# Control is given up after this long without a command.
control_idle_timeout_sec: 600

# Append-only JSON lines: every command and status change.
audit_log: "/home/daq/hv_audit/n1408_audit.jsonl"

# control: true = ON/OFF allowed from the web page. Everything is read either way.
channels:
  0: {name: "ch0", control: false}
  1: {name: "ch1", control: false}
  2: {name: "ch2", control: false}
  3: {name: "ch3", control: false}
