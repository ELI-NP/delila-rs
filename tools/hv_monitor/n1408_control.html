<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N1408 Si HV</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2024; --muted:#646b74; --line:#dfe3e8;
          --green:#14803c; --yellow:#a86500; --red:#c62828; --gray:#6b7280; --blue:#1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1d2125; --text:#e8eaed; --muted:#9aa2ab; --line:#33393f;
            --green:#4ec27a; --yellow:#e0a93e; --red:#ef6a6a; --gray:#9aa2ab; --blue:#7fb0f5; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1120px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  h1 { font-size:20px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  .muted { color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
  th.num { text-align:right; }
  tr:last-child td { border-bottom:0; }
  .badge { display:inline-block; min-width:92px; padding:2px 8px; border-radius:5px; text-align:center;
           font-size:13px; font-weight:650; border:1px solid currentColor; }
  .s-ON { color:var(--green); } .s-RAMP_UP, .s-RAMP_DOWN, .s-SETTLING { color:var(--yellow); }
  .s-OFF, .s-DISABLED, .s-UNKNOWN { color:var(--gray); }
  .s-TRIP, .s-KILL, .s-INTERLOCK { color:var(--red); }
  .flagged { color:var(--red); font-weight:600; }
  label { white-space:nowrap; }
  input[type=number] { width:96px; }
  select { font:inherit; padding:5px 8px; color:var(--text); background:var(--bg);
           border:1px solid var(--line); border-radius:5px; }
  input { font:inherit; padding:5px 8px; color:var(--text); background:var(--bg);
          border:1px solid var(--line); border-radius:5px; }
  button { font:inherit; padding:5px 12px; border-radius:5px; border:1px solid var(--line);
           background:var(--card); color:var(--text); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.on { border-color:var(--green); color:var(--green); }
  button.off { border-color:var(--gray); }
  button.danger { background:var(--red); border-color:var(--red); color:#fff; font-weight:650; }
  @media (prefers-color-scheme: dark) { button.danger { color:#14171a; } }
  #msg { padding:9px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); }
  #msg.bad { border-color:var(--red); color:var(--red); font-weight:600; }
  #msg:empty { display:none; }
  .stale table { opacity:.45; }
  ul { list-style:none; margin:0; padding:0; font-size:13px; }
  li { padding:3px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  li:last-child { border-bottom:0; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>N1408 Si HV</h1><span id="link" class="muted"></span></div>
  <div id="board" class="card row"></div>
  <div id="msg" role="status"></div>

  <div class="card row">
    <span id="who" class="muted"></span>
    <span id="login" class="row">
      <input id="op" placeholder="Your name" autocomplete="name" aria-label="Your name">
      <input id="pass" type="password" placeholder="Passphrase" autocomplete="off" aria-label="Passphrase">
      <button id="acquire">Take control</button>
    </span>
    <button id="release" hidden>Give up control</button>
    <button id="alloff" class="danger" hidden>ALL OFF</button>
  </div>

  <div id="tableCard" class="card scroll">
    <table>
      <thead><tr>
        <th>Ch</th><th>State</th><th class="num">VMON [V]</th><th class="num">IMON [µA]</th>
        <th class="num">VSET [V]</th><th class="num">ISET [µA]</th><th class="num">MAXV [V]</th>
        <th>Pol</th><th class="num">Up / Down [V/s]</th><th class="num">Trip [s]</th><th>Trip mode</th>
        <th>Flags</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="settings" class="card" hidden>
    <div class="row">
      <strong>Settings</strong>
      <label>Channel <select id="setCh"></select></label>
      <label>VSET [V] <input id="setVSET" type="number" step="0.02" min="0"></label>
      <label>ISET [µA] <input id="setISET" type="number" step="0.001" min="0"></label>
      <label>Trip [s] <input id="setTRIP" type="number" step="0.1" min="0" max="999.9"></label>
      <button id="apply">Apply...</button>
      <button id="revert">Show current</button>
    </div>
    <div id="setNow" class="muted" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">Recent commands and status changes
      (the log on the host keeps all of them)</div>
    <ul id="events"></ul>
  </div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const TOKEN_KEY = "n1408_token", OPERATOR_KEY = "n1408_operator";
function stored(key) { try { return sessionStorage.getItem(key); } catch { return null; } }
function store(key, value) {
  try { value ? sessionStorage.setItem(key, value) : sessionStorage.removeItem(key); } catch {}
}
function setToken(t, operator) {
  store(TOKEN_KEY, t); store(OPERATOR_KEY, operator);
  memToken = t; memOperator = operator || null;
}
let memToken = stored(TOKEN_KEY), memOperator = stored(OPERATOR_KEY);
let last = null;
let busy = false;

function show(text, bad) { const m = $("msg"); m.textContent = text || ""; m.className = bad ? "bad" : ""; }
function fmt(v, digits) { return v === null || v === undefined ? "?" : Number(v).toFixed(digits); }
function cell(text, cls) { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; return td; }
function pair(label, value, bad) {
  const s = document.createElement("span");
  const k = document.createElement("span"); k.className = "muted"; k.textContent = label + " ";
  const v = document.createElement("strong"); v.textContent = value; if (bad) v.className = "flagged";
  s.append(k, v); return s;
}
const CRITICAL = ["OVC","OVV","MAXV","TRIP","OVP","OVT","KILL","ILK","NOCAL"];

async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  let data = {};
  try { data = await r.json(); } catch {}
  return { code:r.status, data };
}

async function command(path, label) {
  busy = true; render();
  show(label + " ...");
  try {
    const { code, data } = await post(path, { token: memToken });
    if (code === 401) setToken(null);
    if (data.results) {
      const bad = data.results.filter(r => !r.ok);
      const lines = data.results.map(r => `ch${r.channel}: ${r.result}${r.ok ? "" : " (" + r.message + ")"}`);
      show(`${label}: ${data.ok ? "OK" : bad.length + " channel(s) NOT off"} | ${lines.join(" | ")}`, !data.ok);
    } else {
      show(`${label}: ${data.message || code}`, !data.ok);
    }
  } catch (e) { show(`${label}: no answer (${e}); check the state below`, true); }
  busy = false;
  poll();
}

function powerClick(ch, action) {
  const c = last.channels[ch];
  const what = action === "on"
    ? `Turn ON ch${ch} (${c.name})?\n\nIt will ramp to VSET ${fmt(c.vset,2)} V, polarity ${c.polarity || "?"}, at ${fmt(c.rup,0)} V/s (MAXV ${fmt(c.maxv,0)} V).`
    : `Turn OFF ch${ch} (${c.name})?\n\nNow at ${fmt(c.vmon,2)} V, it will ramp down at ${fmt(c.rdw,0)} V/s.`;
  if (confirm(what)) command(`/api/channel/${ch}/${action}`, `${action.toUpperCase()} ch${ch}`);
}

function daqText(d) {
  if (!d || !d.reachable) return "not answering (state unknown)";
  if (d.running) return d.run === null ? "run in progress" : `run ${d.run} in progress`;
  return d.tuneup ? "Tune Up" : (d.state || "?");
}

// Settings: the inputs follow the readback until someone types in them.
const PARAMS = { VSET:{ field:"vset", digits:2, unit:"V" }, ISET:{ field:"iset", digits:3, unit:"µA" },
                 TRIP:{ field:"trip", digits:1, unit:"s" } };
let dirty = {};
for (const p of Object.keys(PARAMS)) $("set" + p).addEventListener("input", () => { dirty[p] = true; });

function renderSettings(s, mine, remote) {
  const card = $("settings");
  card.hidden = !mine;
  if (!mine) return;
  const select = $("setCh");
  if (select.options.length !== s.channels.length) {
    select.textContent = "";
    for (const c of s.channels) select.add(new Option(`${c.ch} ${c.name}`, c.ch));
  }
  const c = s.channels[Number(select.value)];
  for (const [p, def] of Object.entries(PARAMS)) {
    const input = $("set" + p);
    if (!dirty[p]) input.value = c[def.field] === null ? "" : Number(c[def.field]).toFixed(def.digits);
    input.disabled = !c.control_allowed;
  }
  const blocked = busy || !remote || !c.control_allowed || (s.daq && s.daq.running);
  $("apply").disabled = blocked;
  $("setNow").textContent = `Now: VSET ${fmt(c.vset,2)} V, ISET ${fmt(c.iset,3)} µA, Trip ${fmt(c.trip,1)} s. `
    + `VSET cannot go above MAXV ${fmt(c.maxv,0)} V. MAXV, ramp speeds and the trip mode are changed on the panel (LOCAL).`;
}

async function applySettings() {
  const c = last.channels[Number($("setCh").value)];
  const changes = [];
  for (const [p, def] of Object.entries(PARAMS)) {
    const text = $("set" + p).value, now = c[def.field];
    if (!dirty[p] || text === "" || now === null || Number(text).toFixed(def.digits) === Number(now).toFixed(def.digits)) continue;
    changes.push({ param:p, value:Number(text), expected:now, def });
  }
  if (!changes.length) { show("Nothing to change."); return; }
  const lines = changes.map(x => `${x.param}: ${Number(x.expected).toFixed(x.def.digits)} -> ${x.value.toFixed(x.def.digits)} ${x.def.unit}`);
  const on = c.flags.includes("ON");
  if (on && changes.some(x => x.param === "VSET")) lines.push("", `ch${c.ch} is ON: the voltage starts to move right away (${fmt(c.rup,0)} / ${fmt(c.rdw,0)} V/s).`);
  if (!confirm(`Change ch${c.ch} (${c.name})?\n\n${lines.join("\n")}`)) return;
  busy = true; render();
  const done = [];
  try {
    for (const x of changes) {
      const { code, data } = await post(`/api/channel/${c.ch}/set`, { token:memToken, param:x.param, value:x.value, expected:x.expected });
      if (code === 401) setToken(null);
      if (!data.ok) { show([...done, `${x.param}: ${data.message || code}`, "Stopped here."].join(" | "), true); break; }
      dirty[x.param] = false;
      done.push(`${x.param}: ${data.message}`);
      if (x === changes[changes.length - 1]) show(done.join(" | "));
    }
  } catch (e) { show(`No answer (${e}); check the values`, true); }
  busy = false;
  poll();
}

function render() {
  if (!last) return;
  const s = last, b = s.board || {}, remote = s.connected && b.control === "REMOTE", mine = !!memToken;
  $("link").textContent = s.connected ? `SN ${b.serial}, FW ${b.firmware}` : "";

  const board = $("board"); board.textContent = "";
  if (!s.connected) {
    board.append(pair("Not connected:", s.error || "?", true));
  } else {
    board.append(pair("Panel", b.control || "?", b.control !== "REMOTE"),
                 pair("Interlock", b.interlock || "?", b.interlock !== "NO"),
                 pair("Alarm", b.alarm ?? "?", b.alarm && b.alarm !== "0"),
                 pair("DAQ", daqText(s.daq), !s.daq || !s.daq.reachable || s.daq.running),
                 pair("Updated", s.age_s === null ? "?" : s.age_s.toFixed(0) + " s ago", s.age_s > 10));
    if (s.daq && s.daq.running) {
      const n = document.createElement("span"); n.className = "muted";
      n.textContent = "During a run only OFF works.";
      board.append(n);
    }
    if (b.control === "LOCAL") {
      const n = document.createElement("span"); n.className = "muted";
      n.textContent = "LOCAL: the software cannot switch anything, and a switch going OFF → HV_EN raises the HV.";
      board.append(n);
    }
  }
  $("tableCard").className = "card scroll" + (!s.connected || s.age_s > 10 ? " stale" : "");

  const who = s.control_enabled
    ? (mine ? `Control: you (${s.holder || "?"}), given up after ${Math.round(s.idle_timeout_s / 60)} min idle`
            : (s.holder ? `Control: ${s.holder}. Taking it over tells them nothing, so ask first.` : "Read-only until you take control."))
    : "Read-only: no passphrase file on the host.";
  $("who").textContent = who;
  $("login").hidden = mine || !s.control_enabled;
  $("login").style.display = $("login").hidden ? "none" : "";
  $("release").hidden = !mine;
  $("alloff").hidden = !mine;
  $("alloff").disabled = busy || !remote;

  const rows = $("rows"); rows.textContent = "";
  for (const c of s.channels) {
    const tr = document.createElement("tr");
    tr.append(cell(`${c.ch} ${c.name}`));
    const st = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge s-" + c.state; badge.textContent = c.state.replace("_", " ");
    st.append(badge); tr.append(st);
    tr.append(cell(fmt(c.vmon,2),"num"), cell(fmt(c.imon,4),"num"), cell(fmt(c.vset,2),"num"),
              cell(fmt(c.iset,3),"num"), cell(fmt(c.maxv,0),"num"), cell(c.polarity ?? "?"),
              cell(`${fmt(c.rup,0)} / ${fmt(c.rdw,0)}`,"num"), cell(fmt(c.trip,1),"num"),
              cell(c.pdwn ?? "?"));
    const shown = c.flags.filter(f => !["ON","RUP","RDW"].includes(f));
    tr.append(cell(shown.join(" "), shown.some(f => CRITICAL.includes(f)) ? "flagged" : "muted"));
    const act = document.createElement("td"); act.style.whiteSpace = "nowrap";
    if (mine && c.control_allowed) {
      const on = document.createElement("button"), off = document.createElement("button");
      on.textContent = "ON"; on.className = "on"; off.textContent = "OFF"; off.className = "off";
      const inRun = s.daq && s.daq.running;
      on.disabled = busy || !remote || inRun || c.flags.some(f => ["DIS","KILL","ILK","NOCAL"].includes(f)) || ["ON","RAMP_UP"].includes(c.state);
      off.disabled = busy || !remote || !c.flags.includes("ON");
      on.title = inRun ? "During a run only OFF works" : c.flags.includes("DIS") ? "The channel switch is at OFF: set it to HV_EN" : "";
      on.onclick = () => powerClick(c.ch, "on"); off.onclick = () => powerClick(c.ch, "off");
      act.append(on, " ", off);
    } else if (mine) {
      act.textContent = "not enabled"; act.className = "muted";
    }
    tr.append(act);
    rows.append(tr);
  }

  renderSettings(s, mine, remote);

  const list = $("events"); list.textContent = "";
  for (const e of [...(s.events || [])].reverse().slice(0, 12)) {
    const li = document.createElement("li");
    const ch = e.channel === null || e.channel === undefined ? "" : ` ch${e.channel}`;
    const detail = e.action === "status_change"
      ? `${(e.new || []).map(x => "+" + x).join(" ")} ${(e.gone || []).map(x => "-" + x).join(" ")}`
      : `${e.param ? e.param + " " : ""}${e.result}${e.message ? ": " + e.message : ""}`;
    li.textContent = `${(e.time || "").slice(11, 19)}  ${e.operator || "unit"}  ${e.action}${ch}  ${detail}`;
    list.append(li);
  }
}

async function poll() {
  try {
    const r = await fetch("/api/status");
    last = await r.json();
    if (memToken && last.holder !== memOperator) {  // taken over, or given up after the idle time
      show(last.holder ? `${last.holder} took control.` : "Control given up: idle for too long.", true);
      setToken(null);
    }
    render();
  } catch (e) {
    show("This page cannot reach the program on the DAQ host: what you see below is old.", true);
    $("tableCard").className = "card scroll stale";
  }
}

$("acquire").onclick = async () => {
  const { code, data } = await post("/api/control/acquire", { operator:$("op").value, passphrase:$("pass").value });
  $("pass").value = "";
  if (code === 200) {
    setToken(data.token, $("op").value.trim());
    show(data.preempted ? `You took control from ${data.preempted}.` : "You have control.");
  } else { show(data.message || `Error ${code}`, true); }
  poll();
};
$("setCh").onchange = () => { dirty = {}; render(); };
$("revert").onclick = () => { dirty = {}; render(); };
$("apply").onclick = applySettings;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("acquire").click(); });
$("release").onclick = async () => { await post("/api/control/release", { token:memToken }); setToken(null); show("Control given up."); poll(); };
$("alloff").onclick = () => { if (confirm("Turn OFF every channel enabled for control?")) command("/api/all_off", "ALL OFF"); };
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
