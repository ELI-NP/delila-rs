; eLog for the ThGEM / N_Wall experiment host (pf-qaq). Selected per host with
; ELOG_CFG=elogd_thgem.cfg in docker/.env (see docker-compose.yml).
; One logbook per experiment ([operator.elog] logbook in each TOML). The file is
; bind-mounted: after editing it, `docker compose restart elog` in docker/.
[global]
port = 8082
Theme = default
Comment = pf-qaq DAQ Electronic Logbooks

[ThGEM]
Theme = default
Comment = ThGEM experiment DAQ Logbook

; Attributes
Attributes = Author, Type, Category, Subject, Run Number
; Author is free-text input (no Options = restriction)
Options Type = Routine, Run Summary, Configuration, Problem, Note
Options Category = DAQ, Detector, Beam, General
Required Attributes = Author, Type, Subject

; Display
Reverse sort = 1
Quick filter = Type, Category, Author
Display search = 1
Menu commands = New, Edit, Delete, Reply, Find, Last day, Last 10

; Attachments
Max attachments = 50

; Time format
Time format = %Y-%m-%d %H:%M:%S

[N_Wall]
Theme = default
Comment = N_Wall experiment DAQ Logbook (Si dE-E + neutron wall, 2026-11)

; Attributes (same as ThGEM: the Operator's run summaries fill Type and Run Number)
Attributes = Author, Type, Category, Subject, Run Number
Options Type = Routine, Run Summary, Configuration, Problem, Note
Options Category = DAQ, Detector, Beam, General
Required Attributes = Author, Type, Subject

; Display
Reverse sort = 1
Quick filter = Type, Category, Author
Display search = 1
Menu commands = New, Edit, Delete, Reply, Find, Last day, Last 10

; Attachments
Max attachments = 50

; Time format
Time format = %Y-%m-%d %H:%M:%S
