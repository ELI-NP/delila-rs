# DELILA DAQ Configuration - Write-failure / disk-full stop test (TODO 69)
# Emulator → Merger → Recorder. The Recorder either gets a simulated full
# disk (DELILA_TEST_FAIL_WRITE_AT_BYTES) or writes to a tiny disk image; the
# Operator's run guard (always on) must stop the run, the .delila file must
# end at its last complete block, and Start must be refused afterwards.
# Driven by scripts/write_failure_test.sh — not for production.

[operator]
experiment_name = "WriteFailureTest"
port = 9093
drain_stop_timeout_secs = 60

[network]
[[network.sources]]
id = 0
name = "emu-0"
type = "emulator"
bind = "tcp://*:6655"
command = "tcp://*:6660"
pipeline_order = 1

[network.merger]
publish = "tcp://*:6657"
command = "tcp://*:6670"
pipeline_order = 2

[network.recorder]
subscribe = "tcp://localhost:6657"
command = "tcp://*:6680"
output_dir = "./data/write_failure_test"
pipeline_order = 3
# The script rewrites these per mode (0 = off for the write-failure modes,
# so the free-space guard cannot stop the run first).
disk_soft_free_mb = 0
disk_hard_free_mb = 0

# ~100k ev/s, ~3.5 MB/s: fills a 5 MB budget in ~1.5 s, a 64 MB image in ~15 s.
[settings]
source = "file"

[settings.file]
events_per_batch = 2000
batch_interval_ms = 20
num_modules = 2
channels_per_module = 16
enable_waveform = false
